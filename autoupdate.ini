[Launcher]
; Tiêu đề cửa sổ
Title=Võ Lâm Truyền Kỳ - Tự Động Cập Nhật

; Địa chỉ Web Server / Hosting chứa thư mục update
HostUrl=http://127.0.0.1/uploads

; Tên file danh sách so khớp MD5 trên host
ListFile=list.pak

; Thư mục con trên host chứa các file patch
PatchDir=patch

; Tên file thực thi game
GameExe=game.exe

; Tên file thực thi AutoLogin / AutoPK (đặt cùng thư mục client)
AutoLoginExe=AutoLoginJXAll.exe

; Tự động mở AutoLogin khi bấm "VÀO GAME" (1: Bật, 0: Tắt)
AutoLaunchAutoLogin=0

; URL lấy thông báo sự kiện (để trống nếu không dùng)
NoticeUrl=http://127.0.0.1/uploads/notice.txt

; Tên file hình nền tùy biến (đặt cùng thư mục, hỗ trợ .png / .jpg)
BackgroundImage=bg.png

; Yêu cầu dung lượng đĩa trống tối thiểu (MB)
MinFreeDiskMB=500

; Bật/Tắt tính năng bảo vệ Anti-Cheat phát hiện tool can thiệp (1: Bật, 0: Tắt)
EnableAntiCheat=0

[GameConfig]
; File cấu hình client game JX
IniPath=config.ini

; Danh sách các độ phân giải hỗ trợ (ngăn cách bởi dấu phẩy)
SupportResolutions=800x600,1024x768,1280x720,1366x768,1920x1080

; Tự động kích hoạt chế độ tương thích 16-Bit color trên Windows 10/11
DefaultColor16Bit=1
